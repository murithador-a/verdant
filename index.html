            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A standard clean covers every room: dusting, vacuuming and mopping, kitchen surfaces and appliances wiped down, bathrooms fully sanitised, mirrors and glass polished, bins emptied, and beds made. Deep-cleaning adds inside cabinets, grout detailing, windows, and more."
            }
          },

            "@type": "Question",
            "name": "Do I need to provide cleaning supplies?",

            }
          },

            "@type": "Question",
            "name": "How long does a cleaning take?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A standard apartment clean typically takes 2–4 hours depending on size and condition. Larger homes and deep-cleans can take a full day with a team."
            }
          },
          {
            "@type": "Question",
            "name": "Can I schedule recurring cleaning?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolutely. Our Essential, Comfort, and Signature plans cover monthly rhythms, and short-stay or commercial clients can set fully custom schedules, including daily visits."
            }
          },
          {
            "@type": "Question",
            "name": "Can I reschedule my cleaning?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can reschedule free of charge up to 24 hours before your visit with a quick WhatsApp message."
            }
          },
          {
            "@type": "Question",
            "name": "Do you clean Airbnb properties?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — short-stay turnover is one of our specialties. We handle linen changes, restocking, photo confirmation after every clean, and tight check-in/check-out windows across Lekki, Victoria Island, Ikoyi, and beyond."

          },
          {
            "@type": "Question",
            "name": "Which areas do you currently serve?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We serve Victoria Island, Ikoyi, Lekki, Yaba, Ikeja, Surulere, Ajah, and Lagos Island — plus selected surrounding areas on request."
            }
          },
          {
            "@type": "Question",
            "name": "Do you offer commercial cleaning?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We build reliable cleaning routines for offices, hotels, restaurants, retail spaces, and managed properties — from daily upkeep to periodic deep-cleans."
